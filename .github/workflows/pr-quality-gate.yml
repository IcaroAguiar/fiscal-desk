name: PR Quality Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.action != 'labeled' }}

jobs:
  verify:
    if: >-
      github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name == github.repository || contains(github.event.pull_request.labels.*.name, 'run-ci')) && (github.event.action != 'labeled' || github.event.label.name == 'run-ci')
    permissions:
      contents: read
      pull-requests: read
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_LABELS_CI || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - name: Start work budget
        shell: bash
        run: echo "VERIFY_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install without desktop/browser lifecycle scripts
        run: |-
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild esbuild
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
      - name: Affected unit tests
        shell: bash
        env:
          BASE_SHA: "${{ github.event.pull_request.base.sha }}"
        run: pnpm exec vitest run --changed "$BASE_SHA" --passWithNoTests --maxWorkers=2
      - name: Work budget (300 seconds)
        if: always()
        shell: bash
        run: |-
          elapsed=$(( $(date +%s) - VERIFY_STARTED ))
          echo "verify: ${elapsed}s / 300s"
          [[ $elapsed -le 300 ]]
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
